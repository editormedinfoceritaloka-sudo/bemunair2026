root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/server ./cmd/main.go"
entrypoint = ["./tmp/server"]
delay = 500
exclude_dir = [
  "tmp",
  "vendor",
  "bin",
  "docs",
  ".git"
]
exclude_regex = [
  "_test\\.go"
]
include_ext = [
  "go",
  "html",
  "tmpl",
  "tpl"
]
kill_delay = "500ms"
send_interrupt = true
stop_on_error = true

[color]
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
time = true

[misc]
clean_on_exit = true
