name: bemunair-production

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  db:
    <<: *service-defaults
    image: ${MYSQL_IMAGE:-mysql:8.0}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE wajib diisi}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER wajib diisi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD wajib diisi}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD wajib diisi}
      TZ: ${TZ:-Asia/Jakarta}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - bemunair_mysql_data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - backend

  migrate:
    image: ${SERVER_IMAGE:?SERVER_IMAGE wajib diisi oleh release}
    pull_policy: always
    command: ["./server", "migrate"]
    restart: "no"
    init: true
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment: &server-environment
      APP_ENV: production
      PORT: "8080"
      TZ: ${TZ:-Asia/Jakarta}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:?MYSQL_DATABASE wajib diisi}
      DB_USER: ${MYSQL_USER:?MYSQL_USER wajib diisi}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD wajib diisi}
      DB_MAX_OPEN: ${DB_MAX_OPEN:-20}
      DB_MAX_IDLE: ${DB_MAX_IDLE:-10}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS wajib diisi}
      WA_ENGINE_URL: http://wa-engine:3001
      WA_ENGINE_API_KEY: ${WA_ENGINE_API_KEY:?WA_ENGINE_API_KEY wajib diisi}
      WA_GROUP_JID_1: ${WA_GROUP_JID_1:-}
      WA_GROUP_JID_2: ${WA_GROUP_JID_2:-}
      ADMIN_DASHBOARD_URL: ${ADMIN_DASHBOARD_URL:?ADMIN_DASHBOARD_URL wajib diisi}
      DOCS_DIR: /docs/api
    volumes:
      - ../docs/api:/docs/api:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  server:
    <<: *service-defaults
    image: ${SERVER_IMAGE:?SERVER_IMAGE wajib diisi oleh release}
    pull_policy: always
    environment: *server-environment
    volumes:
      - ../docs/api:/docs/api:ro
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  client:
    <<: *service-defaults
    image: ${CLIENT_IMAGE:?CLIENT_IMAGE wajib diisi oleh release}
    pull_policy: always
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      ORIGIN: ${APP_ORIGIN:?APP_ORIGIN wajib diisi}
      PUBLIC_APP_NAME: ${PUBLIC_APP_NAME:-BEM UNAIR}
      API_INTERNAL_URL: http://server:8080/api/v1
      WA_INTERNAL_URL: http://wa-engine:3001
      IMAGEKIT_PUBLIC_KEY: ${IMAGEKIT_PUBLIC_KEY:?IMAGEKIT_PUBLIC_KEY wajib diisi}
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY:?IMAGEKIT_PRIVATE_KEY wajib diisi}
      IMAGEKIT_UPLOAD_FOLDER: ${IMAGEKIT_UPLOAD_FOLDER:-/bemunair}
      IMAGEKIT_MAX_UPLOAD_BYTES: ${IMAGEKIT_MAX_UPLOAD_BYTES:-20971520}
      IMAGEKIT_MAX_IMAGE_BYTES: ${IMAGEKIT_MAX_IMAGE_BYTES:-20971520}
      IMAGEKIT_MAX_BRIEF_BYTES: ${IMAGEKIT_MAX_BRIEF_BYTES:-15728640}
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(\x27http://127.0.0.1:3000/admin/login\x27).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - frontend
      - backend

  wa-engine:
    <<: *service-defaults
    image: ${WA_ENGINE_IMAGE:?WA_ENGINE_IMAGE wajib diisi oleh release}
    pull_policy: always
    environment:
      NODE_ENV: production
      WA_ENGINE_PORT: "3001"
      WA_ENGINE_API_KEY: ${WA_ENGINE_API_KEY:?WA_ENGINE_API_KEY wajib diisi}
      WA_SESSION_DIR: /app/sessions
      WA_AUTO_CONNECT: ${WA_AUTO_CONNECT:-true}
      WA_SENDER_PHONE: ${WA_SENDER_PHONE:-}
      WA_GROUP_JID_1: ${WA_GROUP_JID_1:-}
      WA_GROUP_JID_2: ${WA_GROUP_JID_2:-}
    volumes:
      - wa_auth_data:/app/sessions
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(\x27http://127.0.0.1:3001/health\x27).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend
      - outbound

  nginx:
    <<: *service-defaults
    image: ${NGINX_IMAGE:-nginx:alpine}
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8081}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=4m
      - /tmp:size=16m
    depends_on:
      client:
        condition: service_healthy
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null && wget -qO- http://127.0.0.1/healthz/client >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - frontend
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  outbound:
    driver: bridge

volumes:
  bemunair_mysql_data:
  wa_auth_data:
