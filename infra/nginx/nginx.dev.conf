worker_processes auto;
pid /var/run/nginx.pid;
# Master stays root only to bind the privileged port; every worker that
# actually parses untrusted client input drops to the unprivileged `nginx`
# user shipped in the base image. Required explicitly because this file
# replaces the image's own nginx.conf, which sets this by default.
user nginx;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    server_tokens off;
    keepalive_timeout 65;
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    # Defense-in-depth rate limiting at the edge, independent of any
    # application-level limiter. Keyed on the real connection IP ($remote_addr),
    # never on a client-controlled header.
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
    limit_req_status 429;

    upstream client_upstream {
        server client:3000;
        keepalive 16;
    }

    upstream server_upstream {
        server server:8080;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost _;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        send_timeout 60s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location = /healthz {
            access_log off;

            proxy_pass http://server_upstream/ping;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Edge replaces X-Forwarded-For instead of appending to it: this is the
            # internet-facing hop, so a client-supplied value must never be trusted
            # downstream (it would otherwise let a client spoof its own source IP
            # for rate limiting / audit logging in the client and server apps).
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location = /healthz/client {
            access_log off;

            proxy_pass http://client_upstream/admin/login;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Edge replaces X-Forwarded-For instead of appending to it: this is the
            # internet-facing hop, so a client-supplied value must never be trusted
            # downstream (it would otherwise let a client spoof its own source IP
            # for rate limiting / audit logging in the client and server apps).
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location = /api/docs {
            proxy_pass http://client_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Edge replaces X-Forwarded-For instead of appending to it: this is the
            # internet-facing hop, so a client-supplied value must never be trusted
            # downstream (it would otherwise let a client spoof its own source IP
            # for rate limiting / audit logging in the client and server apps).
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location ^~ /api/uploads/ {
            proxy_pass http://client_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Edge replaces X-Forwarded-For instead of appending to it: this is the
            # internet-facing hop, so a client-supplied value must never be trusted
            # downstream (it would otherwise let a client spoof its own source IP
            # for rate limiting / audit logging in the client and server apps).
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location = /api/v1/auth/login {
            limit_req zone=login_zone burst=5 nodelay;

            proxy_pass http://server_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location ^~ /api/v1/ {
            limit_req zone=api_zone burst=40 nodelay;

            proxy_pass http://server_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Edge replaces X-Forwarded-For instead of appending to it: this is the
            # internet-facing hop, so a client-supplied value must never be trusted
            # downstream (it would otherwise let a client spoof its own source IP
            # for rate limiting / audit logging in the client and server apps).
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location / {
            proxy_pass http://client_upstream;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Edge replaces X-Forwarded-For instead of appending to it: this is the
            # internet-facing hop, so a client-supplied value must never be trusted
            # downstream (it would otherwise let a client spoof its own source IP
            # for rate limiting / audit logging in the client and server apps).
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            proxy_cache_bypass $http_upgrade;
        }
    }
}